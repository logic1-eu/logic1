name: docs

on:
  push: { branches: [ 'main' ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: '2.9.0-0'
          environment-file: logic1_dev.yaml
          init-shell: bash
          cache-environment: true
          post-cleanup: all
          generate-run-shell: true

      - name: Generate Documentation in HTML format
        run: PYTHONPATH="$PYTHONPATH:$(pwd)" make cython doc
        shell: micromamba-shell {0}

      - uses: actions/upload-pages-artifact@v5
        with: { path: 'doc/build/html' }

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: { name: 'docs', url: '${{ steps.deployment.outputs.page_url }}' }
    steps: [ { id: 'deployment', uses: 'actions/deploy-pages@v5' } ]
